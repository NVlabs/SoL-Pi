<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1116" class="swarm-map-svg" viewBox="0 0 1100 558" role="img" aria-labelledby="swarm-svg-title swarm-svg-desc"><style>:root { --ink:#101114; --soft:#f4f5f2; --font-geist-sans:Arial,Helvetica,sans-serif; }
.swarm-article-section { display: flow-root; }
.swarm-study { --swarm-green: #76b900; }
.swarm-study > p { margin: 0 0 23px; color: #303237; font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-size: 1.08rem; line-height: 1.76; }
.swarm-figure {
  width: min(1260px, calc(100vw - 48px));
  position: relative;
  left: 50%;
  transform: translateX(-50%);
  margin: 34px 0 38px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--paper);
  overflow: hidden;
  font-family: var(--font-geist-sans), Arial, Helvetica, sans-serif;
}
.swarm-figure-header { padding: 22px 190px 10px 26px; display: grid; gap: 8px; position: relative; }
.swarm-expand { position: absolute; right: 26px; top: 28px; font-size: .9rem; line-height: 1.5; font-weight: 600; color: #456f00; text-decoration: none; border-bottom: 1px solid #76b900; }
.swarm-expand:focus-visible { outline: 3px solid #76b900; outline-offset: 5px; }
.swarm-kicker { color: var(--nv-green-dark); font-family: var(--font-geist-mono), monospace; font-size: .75rem; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }
.swarm-figure-header > strong { color: var(--ink); font-size: 1.22rem; font-weight: 650; letter-spacing: -.025em; line-height: 1.25; }
.swarm-diagram-scroll, .swarm-chart-scroll { overflow-x: auto; }
.swarm-diagram-scroll:focus-visible, .swarm-chart-scroll:focus-visible { outline: 2px solid var(--nv-green); outline-offset: -3px; }
.swarm-map-svg { display: block; width: 100%; min-width: 1100px; height: auto; }
.swarm-map-svg text { fill: var(--ink); font-family: var(--font-geist-sans), Arial, Helvetica, sans-serif; }
.swarm-node-main { fill: var(--soft); stroke: #92988a; stroke-width: 1.5; }
.swarm-node-group { fill: white; stroke: #b5b9b0; stroke-width: 1.4; }
.swarm-node-accepted { fill: #f1f7e8; stroke: #5a8f00; stroke-width: 1.7; }
.swarm-node-title { font-size: 27px; font-weight: 650; letter-spacing: -.4px; }
.swarm-node-detail { font-size: 16px; }
.swarm-map-svg .swarm-node-detail { fill: #40443b; }
.swarm-group-title { font-size: 20px; font-weight: 650; }
.swarm-worker { fill: #f5f8ef; stroke: #7c9b47; stroke-width: 1.4; }
.swarm-worker-label { font-size: 18px; font-weight: 650; }
.swarm-board { fill: #f4f5f2; stroke: #b5b9b0; stroke-width: 1.2; }
.swarm-board-title { font-size: 17px; font-weight: 620; }
.swarm-small { font-size: 14px; }
.swarm-map-svg .swarm-small { fill: #40443b; }
.swarm-stage-title { font-size: 22px; font-weight: 650; letter-spacing: -.3px; }
.swarm-flow-green, .swarm-feedback { fill: none; stroke: #5a8f00; stroke-width: 2.5; }
.swarm-feedback { stroke-dasharray: 5 4; }
.swarm-flow-gray { fill: none; stroke: #63685e; stroke-width: 2; }
.swarm-peer-link { fill: none; stroke: #63685e; stroke-width: 1.5; }
.swarm-edge-label { font-size: 14px; }
.swarm-map-svg .swarm-edge-label { fill: #40443b; }
.swarm-harness-strip { margin: 0 25px; padding: 15px 0 16px; border-top: 1px solid var(--line); display: flex; gap: 7px 9px; flex-wrap: wrap; align-items: center; }
.swarm-harness-strip > strong { flex-basis: 100%; font-size: 1rem; font-weight: 620; margin-bottom: 4px; }
.swarm-harness-strip > span { font-size: .875rem; line-height: 1.5; padding: 5px 9px; border: 1px solid #bccd9c; border-radius: 4px; color: #456f00; background: #f7f9f2; }
.swarm-figure figcaption { margin: 0; padding: 14px 25px 17px; border-top: 1px solid var(--line); color: #45494e; font-size: .875rem; line-height: 1.65; }
.swarm-chart-svg { display: block; width: 100%; min-width: 1080px; height: auto; }
.swarm-chart-svg text { font-family: var(--font-geist-sans), Arial, Helvetica, sans-serif; }
.swarm-chart-grid { stroke: #e5e7e2; stroke-width: .7; stroke-dasharray: 2 3; }
.swarm-chart-tick { font-size: 14px; fill: #40443b; }
.swarm-chart-axis-label, .swarm-chart-legend { font-size: 16px; fill: #202020; }
.swarm-chart-note { font-size: 14px; fill: #45494e; }
.swarm-invalid-rule { stroke: #b7bcb2; stroke-width: .8; stroke-dasharray: 3 4; }
.swarm-cost-box > rect { fill: white; stroke: #b5b9b0; stroke-width: 1.3; }
.swarm-cost-heading { font-size: 16px; font-weight: 650; fill: #202020; }
.swarm-cost-row { font-size: 15px; }
.swarm-cost-value { font-size: 17px; font-weight: 650; }
.swarm-table-scroll { overflow-x: auto; margin: 24px 0 28px; }
.swarm-results-table { width: 100%; border-collapse: collapse; font-family: var(--font-geist-sans), Arial, Helvetica, sans-serif; font-size: .83rem; }
.swarm-results-table caption { text-align: left; font-size: .72rem; color: var(--muted); padding: 0 0 10px; }
.swarm-results-table th, .swarm-results-table td { text-align: right; padding: 13px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
.swarm-results-table th:first-child { text-align: left; }
.swarm-results-table thead th { font-size: .71rem; font-weight: 650; color: var(--muted); border-top: 1px solid var(--line); }
.swarm-results-table tbody th { font-weight: 550; }
.swarm-results-table .swarm-highlight { background: #f3f8eb; }
.swarm-results-table .swarm-highlight th { color: #456f00; font-weight: 650; }
.swarm-takeaway { padding: 24px 26px; margin: 30px 0; border-left: 3px solid var(--nv-green); background: var(--soft); }
.swarm-takeaway > strong { display: block; font-family: var(--font-geist-sans), Arial, Helvetica, sans-serif; font-size: 1.1rem; line-height: 1.4; margin-top: 9px; letter-spacing: -.02em; }
.swarm-takeaway > p { font-size: .97rem; line-height: 1.65; margin: 12px 0 0; }
.swarm-method-notes { margin: 28px 0 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 17px 0; }
.swarm-method-notes summary { cursor: pointer; font-family: var(--font-geist-sans), Arial, Helvetica, sans-serif; font-size: .84rem; font-weight: 600; color: var(--muted); }
.swarm-method-notes[open] summary { color: var(--ink); }
.swarm-method-notes p { font-size: .87rem; color: var(--muted); line-height: 1.7; }
.video-source-note { font-size: .8rem; line-height: 1.5; color: var(--muted); }
@media (max-width: 600px) {
  .swarm-figure { width: calc(100vw - 32px); }
  .swarm-figure-header { padding: 18px 18px 8px; }
  .swarm-expand { position: static; justify-self: start; margin: 4px 0 5px; }
  .swarm-figure-header > strong { font-size: 1.08rem; }
  .swarm-figure figcaption { padding: 12px 18px 15px; }
  .swarm-harness-strip { margin: 0 18px; }
  .swarm-results-table th, .swarm-results-table td { padding: 11px 9px; }
  .swarm-results-table { font-size: .74rem; }
  nav { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px 8px; }
  nav a { font-size: .65rem; letter-spacing: .015em; text-align: left; }
}
@media (max-width: 360px) {
  nav { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  nav a { grid-column: auto; font-size: .62rem; }
}

svg.swarm-map-svg { width:2200px; min-width:2200px; height:1116px; background:white; }</style><title id="swarm-svg-title">Five groups of four Luna workers coordinated by one Sol agent</title><desc id="swarm-svg-desc">The Sol coordinator assigns work and broadcasts verified progress. Each of five groups has four independent Pi plus SoL-Pi workers and a local evidence board. Targeted peer notes stay within a group; the coordinator relays compact cross-group findings. Immutable candidate snapshots pass frozen official verification. Only a main-agent accepted strict improvement becomes a commit and score record, then feeds back through the coordinator.</desc><defs><marker id="swarm-arrow-green" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#76b900"></path></marker><marker id="swarm-arrow-gray" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#777777"></path></marker></defs><rect x="374" y="24" width="352" height="88" rx="10" class="swarm-node-main"></rect><text x="550" y="56" text-anchor="middle" class="swarm-node-title">Coordinator</text><text x="550" y="82" text-anchor="middle" class="swarm-node-detail">Codex · GPT-5.6 Sol · xhigh</text><path d="M550 112V157" class="swarm-flow-green" marker-start="url(#swarm-arrow-green)"></path><path d="M144 157H956" class="swarm-flow-green"></path><text x="580" y="139" class="swarm-edge-label">Tasks + frontier ↓ · findings ↑</text><g data-swarm-group="1"><path d="M144 157V182" class="swarm-flow-green" marker-start="url(#swarm-arrow-green)" marker-end="url(#swarm-arrow-green)"></path><rect x="55" y="182" width="178" height="176" rx="10" class="swarm-node-group"></rect><text x="144" y="208" text-anchor="middle" class="swarm-group-title">Group <!-- -->01</text><g data-swarm-worker="0-0"><rect x="72" y="228" width="30" height="34" rx="5" class="swarm-worker"></rect><text x="87" y="250" text-anchor="middle" class="swarm-worker-label">1</text><path d="M87 264V279" class="swarm-peer-link" marker-start="url(#swarm-arrow-gray)" marker-end="url(#swarm-arrow-gray)"></path></g><g data-swarm-worker="0-1"><rect x="110" y="228" width="30" height="34" rx="5" class="swarm-worker"></rect><text x="125" y="250" text-anchor="middle" class="swarm-worker-label">2</text><path d="M125 264V279" class="swarm-peer-link" marker-start="url(#swarm-arrow-gray)" marker-end="url(#swarm-arrow-gray)"></path></g><g data-swarm-worker="0-2"><rect x="148" y="228" width="30" height="34" rx="5" class="swarm-worker"></rect><text x="163" y="250" text-anchor="middle" class="swarm-worker-label">3</text><path d="M163 264V279" class="swarm-peer-link" marker-start="url(#swarm-arrow-gray)" marker-end="url(#swarm-arrow-gray)"></path></g><g data-swarm-worker="0-3"><rect x="186" y="228" width="30" height="34" rx="5" class="swarm-worker"></rect><text x="201" y="250" text-anchor="middle" class="swarm-worker-label">4</text><path d="M201 264V279" class="swarm-peer-link" marker-start="url(#swarm-arrow-gray)" marker-end="url(#swarm-arrow-gray)"></path></g><rect x="65" y="282" width="158" height="56" rx="6" class="swarm-board"></rect><text x="144" y="316" text-anchor="middle" class="swarm-board-title">Group board</text><path d="M144 358V408" class="swarm-flow-gray"></path></g><g data-swarm-group="2"><path d="M347 157V182" class="swarm-flow-green" marker-start="url(#swarm-arrow-green)" marker-end="url(#swarm-arrow-green)"></path><rect x="258" y="182" width="178" height="176" rx="10" class="swarm-node-group"></rect><text x="347" y="208" text-anchor="middle" class="swarm-group-title">Group <!-- -->02</text><g data-swarm-worker="1-0"><rect x="275" y="228" width="30" height="34" rx="5" class="swarm-worker"></rect><text x="290" y="250" text-anchor="middle" class="swarm-worker-label">5</text><path d="M290 264V279" class="swarm-peer-link" marker-start="url(#swarm-arrow-gray)" marker-end="url(#swarm-arrow-gray)"></path></g><g data-swarm-worker="1-1"><rect x="313" y="228" width="30" height="34" rx="5" class="swarm-worker"></rect><text x="328" y="250" text-anchor="middle" class="swarm-worker-label">6</text><path d="M328 264V279" class="swarm-peer-link" marker-start="url(#swarm-arrow-gray)" marker-end="url(#swarm-arrow-gray)"></path></g><g data-swarm-worker="1-2"><rect x="351" y="228" width="30" height="34" rx="5" class="swarm-worker"></rect><text x="366" y="250" text-anchor="middle" class="swarm-worker-label">7</text><path d="M366 264V279" class="swarm-peer-link" marker-start="url(#swarm-arrow-gray)" marker-end="url(#swarm-arrow-gray)"></path></g><g data-swarm-worker="1-3"><rect x="389" y="228" width="30" height="34" rx="5" class="swarm-worker"></rect><text x="404" y="250" text-anchor="middle" class="swarm-worker-label">8</text><path d="M404 264V279" class="swarm-peer-link" marker-start="url(#swarm-arrow-gray)" marker-end="url(#swarm-arrow-gray)"></path></g><rect x="268" y="282" width="158" height="56" rx="6" class="swarm-board"></rect><text x="347" y="316" text-anchor="middle" class="swarm-board-title">Group board</text><path d="M347 358V408" class="swarm-flow-gray"></path></g><g data-swarm-group="3"><path d="M550 157V182" class="swarm-flow-green" marker-start="url(#swarm-arrow-green)" marker-end="url(#swarm-arrow-green)"></path><rect x="461" y="182" width="178" height="176" rx="10" class="swarm-node-group"></rect><text x="550" y="208" text-anchor="middle" class="swarm-group-title">Group <!-- -->03</text><g data-swarm-worker="2-0"><rect x="478" y="228" width="30" height="34" rx="5" class="swarm-worker"></rect><text x="493" y="250" text-anchor="middle" class="swarm-worker-label">9</text><path d="M493 264V279" class="swarm-peer-link" marker-start="url(#swarm-arrow-gray)" marker-end="url(#swarm-arrow-gray)"></path></g><g data-swarm-worker="2-1"><rect x="516" y="228" width="30" height="34" rx="5" class="swarm-worker"></rect><text x="531" y="250" text-anchor="middle" class="swarm-worker-label">10</text><path d="M531 264V279" class="swarm-peer-link" marker-start="url(#swarm-arrow-gray)" marker-end="url(#swarm-arrow-gray)"></path></g><g data-swarm-worker="2-2"><rect x="554" y="228" width="30" height="34" rx="5" class="swarm-worker"></rect><text x="569" y="250" text-anchor="middle" class="swarm-worker-label">11</text><path d="M569 264V279" class="swarm-peer-link" marker-start="url(#swarm-arrow-gray)" marker-end="url(#swarm-arrow-gray)"></path></g><g data-swarm-worker="2-3"><rect x="592" y="228" width="30" height="34" rx="5" class="swarm-worker"></rect><text x="607" y="250" text-anchor="middle" class="swarm-worker-label">12</text><path d="M607 264V279" class="swarm-peer-link" marker-start="url(#swarm-arrow-gray)" marker-end="url(#swarm-arrow-gray)"></path></g><rect x="471" y="282" width="158" height="56" rx="6" class="swarm-board"></rect><text x="550" y="316" text-anchor="middle" class="swarm-board-title">Group board</text><path d="M550 358V408" class="swarm-flow-gray"></path></g><g data-swarm-group="4"><path d="M753 157V182" class="swarm-flow-green" marker-start="url(#swarm-arrow-green)" marker-end="url(#swarm-arrow-green)"></path><rect x="664" y="182" width="178" height="176" rx="10" class="swarm-node-group"></rect><text x="753" y="208" text-anchor="middle" class="swarm-group-title">Group <!-- -->04</text><g data-swarm-worker="3-0"><rect x="681" y="228" width="30" height="34" rx="5" class="swarm-worker"></rect><text x="696" y="250" text-anchor="middle" class="swarm-worker-label">13</text><path d="M696 264V279" class="swarm-peer-link" marker-start="url(#swarm-arrow-gray)" marker-end="url(#swarm-arrow-gray)"></path></g><g data-swarm-worker="3-1"><rect x="719" y="228" width="30" height="34" rx="5" class="swarm-worker"></rect><text x="734" y="250" text-anchor="middle" class="swarm-worker-label">14</text><path d="M734 264V279" class="swarm-peer-link" marker-start="url(#swarm-arrow-gray)" marker-end="url(#swarm-arrow-gray)"></path></g><g data-swarm-worker="3-2"><rect x="757" y="228" width="30" height="34" rx="5" class="swarm-worker"></rect><text x="772" y="250" text-anchor="middle" class="swarm-worker-label">15</text><path d="M772 264V279" class="swarm-peer-link" marker-start="url(#swarm-arrow-gray)" marker-end="url(#swarm-arrow-gray)"></path></g><g data-swarm-worker="3-3"><rect x="795" y="228" width="30" height="34" rx="5" class="swarm-worker"></rect><text x="810" y="250" text-anchor="middle" class="swarm-worker-label">16</text><path d="M810 264V279" class="swarm-peer-link" marker-start="url(#swarm-arrow-gray)" marker-end="url(#swarm-arrow-gray)"></path></g><rect x="674" y="282" width="158" height="56" rx="6" class="swarm-board"></rect><text x="753" y="316" text-anchor="middle" class="swarm-board-title">Group board</text><path d="M753 358V408" class="swarm-flow-gray"></path></g><g data-swarm-group="5"><path d="M956 157V182" class="swarm-flow-green" marker-start="url(#swarm-arrow-green)" marker-end="url(#swarm-arrow-green)"></path><rect x="867" y="182" width="178" height="176" rx="10" class="swarm-node-group"></rect><text x="956" y="208" text-anchor="middle" class="swarm-group-title">Group <!-- -->05</text><g data-swarm-worker="4-0"><rect x="884" y="228" width="30" height="34" rx="5" class="swarm-worker"></rect><text x="899" y="250" text-anchor="middle" class="swarm-worker-label">17</text><path d="M899 264V279" class="swarm-peer-link" marker-start="url(#swarm-arrow-gray)" marker-end="url(#swarm-arrow-gray)"></path></g><g data-swarm-worker="4-1"><rect x="922" y="228" width="30" height="34" rx="5" class="swarm-worker"></rect><text x="937" y="250" text-anchor="middle" class="swarm-worker-label">18</text><path d="M937 264V279" class="swarm-peer-link" marker-start="url(#swarm-arrow-gray)" marker-end="url(#swarm-arrow-gray)"></path></g><g data-swarm-worker="4-2"><rect x="960" y="228" width="30" height="34" rx="5" class="swarm-worker"></rect><text x="975" y="250" text-anchor="middle" class="swarm-worker-label">19</text><path d="M975 264V279" class="swarm-peer-link" marker-start="url(#swarm-arrow-gray)" marker-end="url(#swarm-arrow-gray)"></path></g><g data-swarm-worker="4-3"><rect x="998" y="228" width="30" height="34" rx="5" class="swarm-worker"></rect><text x="1013" y="250" text-anchor="middle" class="swarm-worker-label">20</text><path d="M1013 264V279" class="swarm-peer-link" marker-start="url(#swarm-arrow-gray)" marker-end="url(#swarm-arrow-gray)"></path></g><rect x="877" y="282" width="158" height="56" rx="6" class="swarm-board"></rect><text x="956" y="316" text-anchor="middle" class="swarm-board-title">Group board</text><path d="M956 358V408" class="swarm-flow-gray"></path></g><path d="M144 408H956M222 408V450" class="swarm-flow-gray" marker-end="url(#swarm-arrow-gray)"></path><text x="274" y="435" class="swarm-edge-label">Snapshots + compact evidence</text><rect x="100" y="450" width="245" height="78" rx="9" class="swarm-node-group"></rect><text x="222" y="482" text-anchor="middle" class="swarm-stage-title">Candidate pool</text><text x="222" y="508" text-anchor="middle" class="swarm-node-detail">Immutable snapshots</text><path d="M345 489H426" class="swarm-flow-gray" marker-end="url(#swarm-arrow-gray)"></path><rect x="426" y="450" width="240" height="78" rx="9" class="swarm-node-group"></rect><text x="546" y="482" text-anchor="middle" class="swarm-stage-title">Verification</text><text x="546" y="508" text-anchor="middle" class="swarm-node-detail">Frozen tests + cycles</text><path d="M666 489H746" class="swarm-flow-gray" marker-end="url(#swarm-arrow-gray)"></path><rect x="746" y="450" width="288" height="78" rx="9" class="swarm-node-accepted"></rect><text x="890" y="482" text-anchor="middle" class="swarm-stage-title">Main-agent acceptance</text><text x="890" y="508" text-anchor="middle" class="swarm-node-detail">Strict gain → commit + JSON</text><path d="M1034 489H1074V68H726" class="swarm-feedback" marker-end="url(#swarm-arrow-green)" data-swarm-feedback="accepted-to-coordinator"></path><text x="1088" y="328" transform="rotate(-90 1088 328)" class="swarm-edge-label">Verified progress</text></svg>